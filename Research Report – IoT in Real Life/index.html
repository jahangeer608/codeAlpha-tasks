<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BloomHome &mdash; Smart Home App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="phone">
  <div class="phone-notch"></div>

  <div class="app-screen">

    <!-- ===== STATUS BAR ===== -->
    <div class="status-bar">
      <span id="statusClock">9:41</span>
      <div class="status-icons">
        <span>&#128246;</span><span>&#128294;</span><span>&#128267;</span>
      </div>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div>
        <p class="greet-eyebrow">Good morning</p>
        <h1>Aisha's Home</h1>
      </div>
      <div class="avatar-btn" id="notifBtn">
        <span class="avatar">AK</span>
        <span class="badge" id="notifBadge">3</span>
      </div>
    </header>

    <!-- ===== PAGES ===== -->
    <main class="pages">

      <!-- HOME PAGE -->
      <section class="page active" id="page-home">

        <div class="pulse-hero">
          <svg viewBox="0 0 120 120" class="pulse-ring">
            <circle cx="60" cy="60" r="50" class="pulse-track"></circle>
            <circle cx="60" cy="60" r="50" class="pulse-progress" id="pulseProgress"></circle>
          </svg>
          <div class="pulse-center">
            <span id="pulseValue">--</span>
            <small>Home Pulse</small>
          </div>
        </div>

        <div class="stat-scroll">
          <div class="stat-chip">
            <p class="stat-label">Active</p>
            <p class="stat-value" id="statActiveDevices">0<span>/12</span></p>
          </div>
          <div class="stat-chip">
            <p class="stat-label">Energy</p>
            <p class="stat-value" id="statEnergy">0.0<span>kWh</span></p>
          </div>
          <div class="stat-chip">
            <p class="stat-label">Temp</p>
            <p class="stat-value" id="statTemp">--<span>&deg;C</span></p>
          </div>
          <div class="stat-chip">
            <p class="stat-label">Humidity</p>
            <p class="stat-value" id="statHumidity">--<span>%</span></p>
          </div>
        </div>

        <p class="section-title">Quick controls</p>
        <div class="quick-grid" id="quickGrid"><!-- injected --></div>

        <p class="section-title">Recent activity</p>
        <ul class="activity-log" id="activityLog"><!-- injected --></ul>
      </section>

      <!-- DEVICES PAGE -->
      <section class="page" id="page-devices">
        <div class="room-chips" id="roomNav">
          <button class="chip active" data-room="all">All</button>
          <button class="chip" data-room="living">Living Room</button>
          <button class="chip" data-room="kitchen">Kitchen</button>
          <button class="chip" data-room="bedroom">Bedroom</button>
          <button class="chip" data-room="security">Security</button>
        </div>
        <input type="text" id="deviceSearch" class="search-input" placeholder="Search a device" />
        <div class="device-grid" id="deviceGrid"><!-- injected --></div>
      </section>

      <!-- ENERGY PAGE -->
      <section class="page" id="page-energy">
        <div class="card">
          <p class="section-title no-margin">Live energy usage</p>
          <canvas id="energyChart" height="180"></canvas>
        </div>
        <div class="card thermostat-card">
          <p class="section-title no-margin">Thermostat</p>
          <div class="thermo-control">
            <button id="thermoDown" class="thermo-btn">&minus;</button>
            <div class="thermo-reading"><span id="thermoValue">21</span>&deg;C</div>
            <button id="thermoUp" class="thermo-btn">+</button>
          </div>
          <input type="range" id="thermoSlider" min="16" max="28" value="21" />
        </div>
      </section>

      <!-- SECURITY PAGE -->
      <section class="page" id="page-security">
        <div class="card security-card">
          <div class="panel-head">
            <p class="section-title no-margin">System status</p>
            <button id="armToggle" class="arm-btn armed">Armed</button>
          </div>
          <div class="cam-grid">
            <div class="cam-tile">
              <div class="cam-feed cam-a"></div>
              <span class="cam-label">Front Door <em class="live-dot"></em></span>
            </div>
            <div class="cam-tile">
              <div class="cam-feed cam-b"></div>
              <span class="cam-label">Backyard <em class="live-dot"></em></span>
            </div>
          </div>
        </div>
        <p class="section-title">Security devices</p>
        <div class="device-grid" id="securityGrid"><!-- injected --></div>
      </section>

      <!-- PROFILE PAGE -->
      <section class="page" id="page-profile">
        <div class="card profile-card">
          <span class="avatar avatar-lg">AK</span>
          <h2>Aisha Khan</h2>
          <p class="profile-sub">4 rooms &middot; 12 devices connected</p>
        </div>
        <div class="card list-card">
          <button class="list-row">Household members <span>&rsaquo;</span></button>
          <button class="list-row">Notification settings <span>&rsaquo;</span></button>
          <button class="list-row">Network &amp; hub status <span>&rsaquo;</span></button>
          <button class="list-row">Help &amp; support <span>&rsaquo;</span></button>
        </div>
      </section>

    </main>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="home">
        <span class="nav-ico">&#8962;</span><span>Home</span>
      </button>
      <button class="nav-btn" data-page="devices">
        <span class="nav-ico">&#9889;</span><span>Devices</span>
      </button>
      <button class="nav-btn" data-page="energy">
        <span class="nav-ico">&#128200;</span><span>Energy</span>
      </button>
      <button class="nav-btn" data-page="security">
        <span class="nav-ico">&#128274;</span><span>Security</span>
      </button>
      <button class="nav-btn" data-page="profile">
        <span class="nav-ico">&#128100;</span><span>Profile</span>
      </button>
    </nav>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
