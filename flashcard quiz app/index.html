<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyCards — Flashcard Quiz App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="outer">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">

      <div class="status-bar">
        <span id="clock">9:41</span>
        <div class="icons">
          <svg width="16" height="11" viewBox="0 0 16 11"><rect width="16" height="11" rx="2" fill="#232323"/></svg>
        </div>
      </div>

      <div class="app-header">
        <p class="eyebrow">Study Session</p>
        <h1>StudyCards</h1>
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <span class="progress-count" id="progressCount">1 / 10</span>
        </div>
      </div>

      <!-- CARD VIEW -->
      <div class="card-view" id="cardView">
        <span class="category-tag" id="categoryTag">Biology</span>
        <div class="flip-stage">
          <div class="flip-card" id="flipCard">
            <div class="face face-front">
              <span class="face-label">Question</span>
              <p class="face-text" id="questionText">Loading…</p>
              <button class="show-answer-btn" id="showAnswerBtn">
                Show Answer
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 5L6 9L10 5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span class="tap-hint">or tap the card to flip</span>
            </div>
            <div class="face face-back">
              <span class="face-label">Answer</span>
              <p class="face-text" id="answerText">Loading…</p>
              <span class="tap-hint">tap to flip back</span>
            </div>
          </div>
        </div>
      </div>

      <!-- MANAGE VIEW -->
      <div class="manage-view" id="manageView">
        <div class="manage-header">
          <h2>Manage Cards</h2>
          <button class="add-btn" id="addCardBtn" title="Add card">+</button>
        </div>
        <div class="list-scroll" id="listScroll"></div>
      </div>

      <!-- NAV -->
      <div class="nav-row" id="navRow">
        <button class="nav-btn" id="prevBtn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L4 7L9 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Previous
        </button>
        <button class="nav-btn primary" id="nextBtn">
          Next
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3L10 7L5 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- TAB BAR -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tabStudy">
          <span class="dot">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="3" width="9" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="6" width="9" height="12" rx="1.5" fill="var(--screen-bg)" stroke="currentColor" stroke-width="1.4"/></svg>
          </span>
          Study
        </button>
        <button class="tab-btn" id="tabManage">
          <span class="dot">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 14L4 11L12 3L15 6L7 14H4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </span>
          Manage
        </button>
      </div>

      <!-- MODAL -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-sheet">
          <h3 id="modalTitle">Add Flashcard</h3>
          <div class="field">
            <label>Category</label>
            <input type="text" id="inputCategory" placeholder="e.g. Geography" />
          </div>
          <div class="field">
            <label>Question</label>
            <textarea id="inputQuestion" placeholder="Type the question…"></textarea>
          </div>
          <div class="field">
            <label>Answer</label>
            <textarea id="inputAnswer" placeholder="Type the answer…"></textarea>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" id="cancelBtn">Cancel</button>
            <button class="btn-save" id="saveBtn">Save</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>

    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
