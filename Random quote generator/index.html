<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="home-indicator"></div>
    <div class="app">
      <div class="eyebrow">Quote of the moment</div>
      <div class="eyebrow-sub">tap below for the next one</div>

      <div class="card-wrap">
        <div class="card" id="card">
          <div class="tab" id="tab">No. 01</div>
          <div class="mark">&ldquo;</div>
          <p class="quote-text" id="quoteText"></p>
          <div class="author-row">
            <span class="author-line"></span>
            <span class="author" id="quoteAuthor"></span>
          </div>
        </div>
      </div>

      <div class="ticket">
        <span id="seqLabel">1 / 10</span>
        <span class="dots" id="dots"></span>
      </div>

      <button id="newQuoteBtn">New Quote</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
