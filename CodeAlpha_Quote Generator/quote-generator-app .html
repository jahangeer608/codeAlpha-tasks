<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Quote Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0E2429;
  --bg-page:#0A1B1F;
  --card:#153338;
  --card-edge:#1E4147;
  --ink:#F3ECDC;
  --ink-dim:#9FB8B6;
  --brass:#D4A24C;
  --brass-dim:#8A6F3C;
  --danger:#E4796B;
  --danger-bg:#3A1E1B;
}
*{box-sizing:border-box;}
html,body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%, #123137 0%, var(--bg-page) 55%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Work Sans', Arial, sans-serif;
  padding:32px 16px;
}

button{ font-family:inherit; }
button:focus-visible,
select:focus-visible{
  outline:2px solid var(--ink);
  outline-offset:3px;
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important; }
}

/* ---- phone frame ---- */
.phone{
  width:min(390px, 94vw);
  height:min(820px, 94vh);
  background:#050D0F;
  border-radius:52px;
  padding:14px;
  box-shadow:
    0 40px 80px -20px rgba(0,0,0,0.7),
    0 0 0 2px #1a1a1a inset;
  position:relative;
}
.phone::before{
  content:"";
  position:absolute;
  top:26px; left:50%;
  transform:translateX(-50%);
  width:120px; height:26px;
  background:#050D0F;
  border-radius:20px;
  z-index:5;
}
.screen{
  width:100%;
  height:100%;
  background:var(--bg-deep);
  border-radius:38px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.home-indicator{
  position:absolute;
  bottom:10px; left:50%;
  transform:translateX(-50%);
  width:120px; height:4px;
  border-radius:3px;
  background:rgba(243,236,220,0.35);
  z-index:5;
}

/* ---- app content ---- */
.app{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:56px 26px 28px;
  position:relative;
  min-height:0;
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--brass);
  text-align:center;
  margin-bottom:6px;
}
.eyebrow-sub{
  font-family:'Work Sans', sans-serif;
  font-size:12px;
  color:var(--ink-dim);
  text-align:center;
  margin-bottom:auto;
}

.card-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px 0;
  min-height:0;
}
.card{
  background:var(--card);
  border:1px solid var(--card-edge);
  border-radius:18px;
  padding:32px 24px 26px;
  width:100%;
  position:relative;
  box-shadow:0 18px 40px -18px rgba(0,0,0,0.55);
  opacity:0;
  transform:translateY(10px);
  animation:rise 0.5s ease forwards;
}
@keyframes rise{ to{opacity:1; transform:translateY(0);} }
@keyframes slideNext{ from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:translateX(0);} }
@keyframes slidePrev{ from{opacity:0; transform:translateX(-18px);} to{opacity:1; transform:translateX(0);} }

.tab{
  position:absolute;
  top:-13px; left:26px;
  background:var(--brass);
  color:var(--bg-page);
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  font-weight:500;
  letter-spacing:0.08em;
  padding:5px 10px;
  border-radius:5px;
}
.fav-btn{
  position:absolute;
  top:-13px; right:20px;
  width:30px; height:30px;
  border-radius:50%;
  border:1px solid var(--card-edge);
  background:var(--card);
  color:var(--ink-dim);
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:color 0.15s, transform 0.12s, border-color 0.15s;
}
.fav-btn:hover{ border-color:var(--brass); }
.fav-btn:active{ transform:scale(0.9); }
.fav-btn.active{ color:var(--brass); border-color:var(--brass); }

.mark{
  font-family:'Fraunces', serif;
  font-size:44px;
  color:var(--brass-dim);
  line-height:1;
  margin:6px 0 4px;
}
.quote-text{
  font-family:'Fraunces', serif;
  font-weight:400;
  font-style:italic;
  font-size:21px;
  line-height:1.45;
  color:var(--ink);
  margin:0 0 20px;
  min-height:120px;
}
.author-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.author-line{
  flex:0 0 22px;
  height:1px;
  background:var(--brass);
}
.author{
  font-family:'Work Sans', sans-serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:0.02em;
  color:var(--ink);
}

.ticket{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:14px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  color:var(--ink-dim);
  letter-spacing:0.08em;
}
.dots{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:5px;
  max-width:200px;
}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(159,184,182,0.35);
  flex:none;
}
.dot.seen{background:var(--brass);}

/* ---- icon action row: previous / pronounce / share ---- */
.icon-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:16px;
}
.icon-btn{
  appearance:none;
  border:1px solid var(--card-edge);
  background:var(--card);
  color:var(--ink);
  width:46px;
  height:46px;
  border-radius:50%;
  font-size:16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:border-color 0.15s, transform 0.12s, background 0.15s, color 0.15s;
}
.icon-btn:hover{ border-color:var(--brass); color:var(--brass); }
.icon-btn:active{ transform:scale(0.93); }
.icon-btn[disabled]{ opacity:0.35; cursor:not-allowed; }
.icon-btn[disabled]:hover{ border-color:var(--card-edge); color:var(--ink); }
.icon-btn.speaking{ border-color:var(--brass); color:var(--brass); animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(212,162,76,0.35); }
  50%{ box-shadow:0 0 0 6px rgba(212,162,76,0); }
}

.voice-row{
  margin-top:10px;
  display:flex;
  justify-content:center;
}
.voice-select{
  width:100%;
  max-width:280px;
  background:var(--card);
  border:1px solid var(--card-edge);
  color:var(--ink-dim);
  font-family:'Work Sans', sans-serif;
  font-size:11px;
  padding:7px 8px;
  border-radius:8px;
}

button#newQuoteBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  width:100%;
  padding:16px 0;
  border-radius:30px;
  background:var(--brass);
  color:#1B120A;
  font-family:'Work Sans', sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:0.03em;
  margin-top:18px;
  transition:transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
  box-shadow:0 10px 24px -10px rgba(212,162,76,0.55);
}
button#newQuoteBtn:hover{ background:#E4B667; }
button#newQuoteBtn:active{ transform:scale(0.97); box-shadow:0 4px 12px -6px rgba(212,162,76,0.5); }

/* ---- toast ---- */
.toast{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translate(-50%, 10px);
  background:var(--card);
  border:1px solid var(--card-edge);
  color:var(--ink);
  font-family:'Work Sans', sans-serif;
  font-size:12px;
  padding:9px 16px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s ease, transform 0.2s ease;
  z-index:20;
  white-space:nowrap;
  max-width:88%;
  overflow:hidden;
  text-overflow:ellipsis;
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }
.toast.error{ border-color:var(--danger); color:var(--danger); background:var(--danger-bg); }

.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

@media (max-width: 420px){
  .app{ padding:48px 18px 22px; }
  .quote-text{ font-size:19px; min-height:100px; }
  .icon-btn{ width:42px; height:42px; }
}
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="home-indicator"></div>
    <div class="app">
      <div class="eyebrow">Quote of the moment</div>
      <div class="eyebrow-sub">tap below for the next one</div>

      <div class="card-wrap">
        <div class="card" id="card">
          <div class="tab" id="tab">No. 01</div>
          <button class="fav-btn" id="favBtn" type="button" aria-pressed="false" aria-label="Save this quote to favorites">♥</button>
          <div class="mark" aria-hidden="true">&ldquo;</div>
          <p class="quote-text" id="quoteText" aria-live="polite"></p>
          <div class="author-row">
            <span class="author-line"></span>
            <span class="author" id="quoteAuthor"></span>
          </div>
        </div>
      </div>

      <div class="ticket">
        <span id="seqLabel">1 / 10</span>
        <span class="dots" id="dots"></span>
      </div>

      <div class="icon-row">
        <button class="icon-btn" id="prevBtn" type="button" aria-label="Previous quote" disabled>‹</button>
        <button class="icon-btn" id="pronounceBtn" type="button" aria-label="Read quote aloud">🔊</button>
        <button class="icon-btn" id="shareBtn" type="button" aria-label="Copy or share this quote">📤</button>
      </div>

      <div class="voice-row">
        <select class="voice-select" id="voiceSelect" aria-label="Voice for pronunciation"></select>
      </div>

      <button id="newQuoteBtn" type="button">New Quote →</button>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================
     QUOTES
  ========================================= */
  const quotes = [
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "Life is what happens to you while you're busy making other plans.", author: "John Lennon" },
    { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
    { text: "It is during our darkest moments that we must focus to see the light.", author: "Aristotle" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
    { text: "Whether you think you can or you think you can't, you're right.", author: "Henry Ford" },
    { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "The best way to predict the future is to create it.", author: "Peter Drucker" },
    { text: "Turn your wounds into wisdom.", author: "Oprah Winfrey" },
    { text: "Everything you've ever wanted is on the other side of fear.", author: "George Addair" },
    { text: "Act as if what you do makes a difference. It does.", author: "William James" },
    { text: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky" },
    { text: "The mind is everything. What you think you become.", author: "Buddha" },
    { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" },
    { text: "What lies behind us and before us are small matters compared to what lies within us.", author: "Ralph Waldo Emerson" },
    { text: "A journey of a thousand miles begins with a single step.", author: "Lao Tzu" },
    { text: "I have not failed. I've just found 10,000 ways that won't work.", author: "Thomas Edison" },
    { text: "Do not go where the path may lead; go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson" },
    { text: "Knowing yourself is the beginning of all wisdom.", author: "Aristotle" },
    { text: "You must be the change you wish to see in the world.", author: "Mahatma Gandhi" },
    { text: "The only limit to our realization of tomorrow is our doubts of today.", author: "Franklin D. Roosevelt" },
    { text: "Twenty years from now you will be more disappointed by the things you didn't do than by the ones you did do.", author: "Mark Twain" },
    { text: "Not all those who wander are lost.", author: "J. R. R. Tolkien" },
    { text: "Happiness is not something ready made. It comes from your own actions.", author: "Dalai Lama" },
    { text: "The purpose of our lives is to be happy.", author: "Dalai Lama" },
    { text: "Change your thoughts and you change your world.", author: "Norman Vincent Peale" }
  ];

  /* =========================================
     ELEMENTS
  ========================================= */
  const $ = (id) => document.getElementById(id);

  const quoteText = $("quoteText");
  const quoteAuthor = $("quoteAuthor");
  const tab = $("tab");
  const seqLabel = $("seqLabel");
  const dotsWrap = $("dots");
  const card = $("card");
  const newQuoteBtn = $("newQuoteBtn");
  const prevBtn = $("prevBtn");
  const pronounceBtn = $("pronounceBtn");
  const shareBtn = $("shareBtn");
  const favBtn = $("favBtn");
  const voiceSelect = $("voiceSelect");
  const toast = $("toast");

  /* =========================================
     TOAST
  ========================================= */
  let toastTimer = null;
  function showToast(message, type) {
    toast.textContent = message;
    toast.className = "toast show" + (type === "error" ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = "toast"; }, 2600);
  }

  /* =========================================
     BUILD SEQUENCE DOTS (one per quote)
  ========================================= */
  quotes.forEach(() => {
    const d = document.createElement("span");
    d.className = "dot";
    dotsWrap.appendChild(d);
  });
  const dotEls = Array.from(dotsWrap.children);

  /* =========================================
     SHUFFLE-BAG: walk every quote once in random
     order before repeating any
  ========================================= */
  function shuffledIndices() {
    const arr = quotes.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let bag = shuffledIndices();
  let bagStep = 0;      // position within the current shuffle pass
  let history = [];     // quote indices actually shown, in visit order
  let pointer = -1;     // position within history currently displayed

  /* =========================================
     FAVORITES (persisted in localStorage)
  ========================================= */
  const FAV_KEY = "quoteGenerator.favorites";
  function loadFavorites() {
    try {
      const raw = localStorage.getItem(FAV_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveFavorites(list) {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); } catch (e) { /* storage unavailable */ }
  }
  let favorites = loadFavorites();

  function isFavorite(quoteIndex) {
    const q = quotes[quoteIndex];
    return favorites.some(f => f.text === q.text && f.author === q.author);
  }

  function toggleFavorite(quoteIndex) {
    const q = quotes[quoteIndex];
    if (isFavorite(quoteIndex)) {
      favorites = favorites.filter(f => !(f.text === q.text && f.author === q.author));
      showToast("Removed from favorites.");
    } else {
      favorites.push({ text: q.text, author: q.author });
      showToast("Saved to favorites.");
    }
    saveFavorites(favorites);
    updateFavButton(quoteIndex);
  }

  function updateFavButton(quoteIndex) {
    const active = isFavorite(quoteIndex);
    favBtn.classList.toggle("active", active);
    favBtn.setAttribute("aria-pressed", String(active));
    favBtn.setAttribute("aria-label", active ? "Remove this quote from favorites" : "Save this quote to favorites");
  }

  /* =========================================
     RENDER
  ========================================= */
  function render(direction) {
    const idx = history[pointer];
    const q = quotes[idx];

    quoteText.textContent = q.text;
    quoteAuthor.textContent = q.author;
    tab.textContent = "No. " + String(pointer + 1).padStart(2, "0");
    seqLabel.textContent = (pointer + 1) + " / " + quotes.length;

    dotEls.forEach((d, i) => d.classList.toggle("seen", i <= (bagStep === 0 ? 0 : bagStep)));

    prevBtn.disabled = pointer <= 0;
    updateFavButton(idx);

    const animName = direction === "prev" ? "slidePrev" : direction === "next" ? "slideNext" : "rise";
    card.style.animation = "none";
    void card.offsetWidth; // restart animation
    card.style.animation = animName + " 0.4s ease forwards";
  }

  function goNext() {
    if (pointer < history.length - 1) {
      // user had gone back — step forward through existing history first
      pointer += 1;
    } else {
      const idx = bag[bagStep];
      history.push(idx);
      pointer = history.length - 1;
      bagStep += 1;
      if (bagStep >= bag.length) {
        bag = shuffledIndices();
        bagStep = 0;
      }
    }
    render("next");
  }

  function goPrev() {
    if (pointer > 0) {
      pointer -= 1;
      render("prev");
    }
  }

  newQuoteBtn.addEventListener("click", goNext);
  prevBtn.addEventListener("click", goPrev);
  favBtn.addEventListener("click", () => toggleFavorite(history[pointer]));

  /* =========================================
     KEYBOARD SHORTCUTS
  ========================================= */
  document.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "SELECT" || e.target.tagName === "INPUT")) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goNext(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
  });

  /* =========================================
     TEXT-TO-SPEECH ("PRONOUNCE")
  ========================================= */
  const speechSupported = "speechSynthesis" in window;

  function populateVoices() {
    if (!speechSupported) return;
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;

    const previousValue = voiceSelect.value;
    voiceSelect.innerHTML = "";
    voices.forEach((voice, i) => {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = `${voice.name} (${voice.lang})`;
      voiceSelect.appendChild(option);
    });

    if (!previousValue) {
      const browserLang = (navigator.language || "en").toLowerCase();
      const matchIndex = voices.findIndex(v => v.lang.toLowerCase().startsWith(browserLang.slice(0, 2)));
      if (matchIndex >= 0) voiceSelect.value = String(matchIndex);
    } else {
      voiceSelect.value = previousValue;
    }
  }

  if (speechSupported) {
    populateVoices();
    window.speechSynthesis.addEventListener("voiceschanged", populateVoices);
  } else {
    pronounceBtn.disabled = true;
    voiceSelect.disabled = true;
    voiceSelect.innerHTML = '<option>Text-to-speech not supported</option>';
  }

  function speakCurrentQuote() {
    if (!speechSupported) return;
    const idx = history[pointer];
    const q = quotes[idx];
    const text = `${q.text} — by ${q.author}`;

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    const selectedVoice = voices[Number(voiceSelect.value)];
    if (selectedVoice) utterance.voice = selectedVoice;

    utterance.onstart = () => pronounceBtn.classList.add("speaking");
    utterance.onend = () => pronounceBtn.classList.remove("speaking");
    utterance.onerror = () => pronounceBtn.classList.remove("speaking");

    window.speechSynthesis.speak(utterance);
  }

  pronounceBtn.addEventListener("click", () => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      pronounceBtn.classList.remove("speaking");
      return;
    }
    speakCurrentQuote();
  });

  /* =========================================
     SHARE / COPY
  ========================================= */
  async function shareCurrentQuote() {
    const idx = history[pointer];
    const q = quotes[idx];
    const text = `"${q.text}" — ${q.author}`;

    if (navigator.share) {
      try {
        await navigator.share({ text });
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return; // user cancelled share sheet
        // fall through to clipboard on other errors
      }
    }

    try {
      await navigator.clipboard.writeText(text);
      showToast("Quote copied to clipboard.");
    } catch (err) {
      const tempInput = document.createElement("textarea");
      tempInput.value = text;
      tempInput.style.position = "fixed";
      tempInput.style.opacity = "0";
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand("copy");
        showToast("Quote copied to clipboard.");
      } catch (fallbackErr) {
        showToast("Couldn't copy automatically.", "error");
      }
      document.body.removeChild(tempInput);
    }
  }

  shareBtn.addEventListener("click", shareCurrentQuote);

  /* =========================================
     INITIAL RENDER
  ========================================= */
  goNext();
})();
</script>
</body>
</html>
