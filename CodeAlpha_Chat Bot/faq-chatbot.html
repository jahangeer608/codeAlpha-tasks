<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Assistant — FAQ Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0b1226;
  --bg-panel: #101832;
  --bg-panel-2: #131d3d;
  --text-primary: #edeff7;
  --text-muted: #8c93b0;
  --teal: #2dd4bf;
  --violet: #7c6ff0;
  --green: #34d399;
  --user-bubble: #2a3a6b;
  --radius-md: 14px;
}
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0;
  background: radial-gradient(120% 120% at 50% 0%, #0f1730 0%, #060a17 65%, #04060d 100%);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.stage {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 32px 16px; gap: 16px;
}
.stage-caption {
  color: var(--text-muted); font-family: 'IBM Plex Mono', monospace;
  font-size: 12px; letter-spacing: 0.02em; text-align: center; margin: 0;
}
.app-window {
  width: 420px; max-width: 100%; height: 680px; max-height: 88vh;
  background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
  border-radius: 28px; border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02) inset;
  display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.app-header {
  position: relative; padding: 22px 20px 18px; overflow: hidden;
  flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.aurora-glow {
  position: absolute; inset: -60% -20% auto -20%; height: 220%;
  background: conic-gradient(from 180deg at 50% 50%, var(--teal), var(--violet), var(--green), var(--teal));
  filter: blur(60px); opacity: 0.28;
  animation: driftAurora 14s ease-in-out infinite alternate; pointer-events: none;
}
@keyframes driftAurora {
  0%   { transform: translate(-4%, -2%) rotate(0deg) scale(1); }
  100% { transform: translate(4%, 3%) rotate(8deg) scale(1.08); }
}
@media (prefers-reduced-motion: reduce) { .aurora-glow { animation: none; } }
.header-content { position: relative; display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--teal), var(--violet)); color: #0b1226;
}
.avatar svg { width: 22px; height: 22px; }
.header-text h1 {
  font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600;
  margin: 0 0 2px; letter-spacing: -0.01em;
}
.status { margin: 0; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); display: inline-block; }
.chat-area {
  flex: 1; overflow-y: auto; padding: 20px 16px 8px;
  display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent;
}
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 6px; }
.msg-row { display: flex; width: 100%; }
.msg-row.user { justify-content: flex-end; }
.msg-row.bot { justify-content: flex-start; }
.bubble { max-width: 82%; padding: 11px 14px; font-size: 14px; line-height: 1.48; animation: riseIn 0.25s ease both; }
.bubble p { margin: 0; }
.bot-bubble {
  background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.07);
  border-left: 2.5px solid; border-image: linear-gradient(180deg, var(--teal), var(--violet)) 1;
  border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md); color: var(--text-primary);
}
.user-bubble {
  background: linear-gradient(135deg, var(--user-bubble), #33447e);
  border-radius: var(--radius-md) 4px var(--radius-md) var(--radius-md); color: #f2f4fc;
}
.confidence-tag {
  display: block; margin-top: 6px; font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; letter-spacing: 0.03em; color: var(--text-muted);
}
@keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 2px 8px; }
.chip {
  border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03);
  color: var(--text-primary); font-size: 12.5px; padding: 7px 12px; border-radius: 999px;
  cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
}
.chip:hover { border-color: var(--teal); background: rgba(45,212,191,0.08); transform: translateY(-1px); }
.typing-row { padding: 0 16px 8px; flex-shrink: 0; }
.typing-bubble { display: inline-flex; gap: 4px; padding: 12px 14px; }
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.1s infinite ease-in-out; }
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
.input-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.12);
}
.input-bar input {
  flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 999px; padding: 11px 16px; color: var(--text-primary); font-size: 14px;
  font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.15s ease;
}
.input-bar input:focus { border-color: var(--teal); }
.input-bar input::placeholder { color: var(--text-muted); }
.input-bar button {
  width: 40px; height: 40px; flex-shrink: 0; border: none; border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--violet)); color: #0b1226;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.input-bar button svg { width: 17px; height: 17px; }
.input-bar button:hover { transform: scale(1.06); filter: brightness(1.08); }
.input-bar button:active { transform: scale(0.96); }
@media (max-width: 480px) {
  .app-window { height: 100vh; max-height: 100vh; border-radius: 0; width: 100%; }
  .stage { padding: 0; }
  .stage-caption { display: none; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="app-window">
    <header class="app-header">
      <div class="aurora-glow" aria-hidden="true"></div>
      <div class="header-content">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C9 6 6 8 6 12a6 6 0 0 0 12 0c0-4-3-6-6-10Z" fill="currentColor" opacity="0.9"/>
            <circle cx="12" cy="13" r="2.2" fill="#0B1226"/>
          </svg>
        </div>
        <div class="header-text">
          <h1>Aurora Assistant</h1>
          <p class="status"><span class="dot"></span>Online · Ask me about your earbuds</p>
        </div>
      </div>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="msg-row bot">
        <div class="bubble bot-bubble">
          <p>Hi! I'm Aurora Assistant. I can answer questions about pairing, battery life, charging, warranty, and more. What would you like to know?</p>
        </div>
      </div>
      <div class="chips" id="suggestionChips"></div>
    </main>

    <div class="typing-row" id="typingRow" hidden>
      <div class="bubble bot-bubble typing-bubble">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
      </div>
    </div>

    <form class="input-bar" id="chatForm" autocomplete="off">
      <input type="text" id="userInput" placeholder="Type your question…" aria-label="Type your question" />
      <button type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11.5L20 4L12.5 21L10.5 13.5L3 11.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
        </svg>
      </button>
    </form>
  </div>
  <p class="stage-caption">FAQ Chatbot demo · JS tokenizing + TF-IDF cosine similarity matching · runs 100% in-browser, no server</p>
</div>

<script>
/* ---------- 1. FAQ DATA — edit this array with your own Q&As ---------- */
const FAQS = [
  { q: "How do I pair my Aurora earbuds with my phone?", a: "Open the charging case near your phone, hold the button on the back for 3 seconds until the light flashes blue, then select 'Aurora Buds' in your phone's Bluetooth settings." },
  { q: "What is the battery life of the earbuds?", a: "The earbuds last up to 8 hours on a single charge, and the charging case provides 3 additional full charges, for up to 32 hours of total listening time." },
  { q: "How long does it take to fully charge the case?", a: "The charging case takes about 1.5 hours to fully charge via USB-C, and supports wireless charging in 2 hours." },
  { q: "Are the earbuds waterproof?", a: "The earbuds are rated IPX4, meaning they can handle sweat and light rain, but should not be submerged in water." },
  { q: "How do I reset my earbuds to factory settings?", a: "Place both earbuds in the case, hold the button for 10 seconds until the LED flashes red and white three times, then release to complete the reset." },
  { q: "Why is only one earbud working?", a: "This usually happens when the earbuds get out of sync. Place both buds back in the case for 10 seconds, take them out, and they should reconnect automatically." },
  { q: "Can I use one earbud at a time?", a: "Yes, both the left and right earbuds can be used independently in mono mode for calls or casual listening." },
  { q: "Do the earbuds support noise cancellation?", a: "Yes, Aurora earbuds feature active noise cancellation (ANC) which can be toggled on or off through the companion app." },
  { q: "How do I control volume and playback?", a: "Tap once on either earbud to play or pause, double-tap to skip forward, triple-tap to go back, and press and hold to adjust volume up or down." },
  { q: "What should I do if my earbuds won't charge?", a: "Clean the charging contacts on both the earbuds and the case with a dry cloth, ensure the cable is fully connected, and try a different USB port or wall adapter." },
  { q: "Is there a warranty on the earbuds?", a: "Aurora earbuds come with a 1-year limited warranty covering manufacturing defects. Register your product online to activate the warranty." },
  { q: "How do I update the earbud firmware?", a: "Open the Aurora companion app, go to Settings > Device, and tap 'Check for Updates'. Keep the earbuds connected and within range during the update." },
  { q: "What's your return policy?", a: "You can return unused or defective products within 30 days of purchase for a full refund. Contact support with your order number to start a return." },
  { q: "Do the earbuds work with both Android and iPhone?", a: "Yes, Aurora earbuds are compatible with any Bluetooth 5.0+ device, including both Android and iOS phones, tablets, and laptops." },
  { q: "How do I find my lost earbud?", a: "Use the 'Find My Buds' feature in the Aurora app, which shows the last connected location and can play a sound to help you locate a nearby earbud." }
];

const SIMILARITY_THRESHOLD = 0.15;

/* ---------- 2. Preprocessing: lowercase, strip punctuation, tokenize, remove stopwords, light stem ---------- */
const STOPWORDS = new Set(["a","an","the","is","are","was","were","be","been","being","i","you","he","she","it","we","they","my","your","his","her","its","our","their","this","that","these","those","of","in","on","at","to","for","with","and","or","but","if","do","does","did","can","could","will","would","should","have","has","had","not","no","so","what","how","when","where","why","which","who","whom"]);

function stem(word) {
  // very light suffix-stripping stemmer (good enough for short FAQ text)
  return word
    .replace(/(ing|edly|ed|es|s)$/,"")
    .replace(/'$/,"");
}

function preprocess(text) {
  const cleaned = text.toLowerCase().replace(/[^a-z0-9\s']/g, " ");
  const tokens = cleaned.split(/\s+/).filter(Boolean);
  return tokens
    .filter(t => !STOPWORDS.has(t) && t.length > 1)
    .map(stem);
}

/* ---------- 3. TF-IDF vectorization ---------- */
const docsTokens = FAQS.map(f => preprocess(f.q));
const vocab = Array.from(new Set(docsTokens.flat()));
const vocabIndex = new Map(vocab.map((w, i) => [w, i]));

function termFreq(tokens) {
  const tf = new Array(vocab.length).fill(0);
  tokens.forEach(t => {
    const idx = vocabIndex.get(t);
    if (idx !== undefined) tf[idx] += 1;
  });
  const total = tokens.length || 1;
  return tf.map(c => c / total);
}

// document frequency per term, across all FAQ questions
const df = new Array(vocab.length).fill(0);
docsTokens.forEach(tokens => {
  new Set(tokens).forEach(t => {
    const idx = vocabIndex.get(t);
    if (idx !== undefined) df[idx] += 1;
  });
});
const N = docsTokens.length;
const idf = df.map(d => Math.log((N + 1) / (d + 1)) + 1);

function tfidfVector(tokens) {
  const tf = termFreq(tokens);
  return tf.map((v, i) => v * idf[i]);
}

const faqVectors = docsTokens.map(tokens => tfidfVector(tokens));

function cosineSim(a, b) {
  let dot = 0, magA = 0, magB = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    magA += a[i] * a[i];
    magB += b[i] * b[i];
  }
  if (magA === 0 || magB === 0) return 0;
  return dot / (Math.sqrt(magA) * Math.sqrt(magB));
}

/* ---------- 4. Matching: find the best FAQ for a user query ---------- */
function getResponse(userText) {
  const tokens = preprocess(userText);
  if (tokens.length === 0) {
    return { answer: "I couldn't quite understand that. Could you rephrase your question?", confidence: 0 };
  }
  const queryVec = tfidfVector(tokens);
  let bestIdx = -1, bestScore = -1;
  faqVectors.forEach((vec, i) => {
    const score = cosineSim(queryVec, vec);
    if (score > bestScore) { bestScore = score; bestIdx = i; }
  });

  if (bestScore < SIMILARITY_THRESHOLD) {
    return {
      answer: "I'm not sure I have an answer for that yet. Try rephrasing, or ask something else about the product.",
      confidence: bestScore
    };
  }
  return { answer: FAQS[bestIdx].a, confidence: bestScore };
}

/* ---------- 5. Chat UI wiring ---------- */
const chatArea = document.getElementById('chatArea');
const chatForm = document.getElementById('chatForm');
const userInput = document.getElementById('userInput');
const typingRow = document.getElementById('typingRow');
const suggestionChips = document.getElementById('suggestionChips');

function scrollToBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

function addMessage(text, sender, confidence = null) {
  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;
  const bubble = document.createElement('div');
  bubble.className = `bubble ${sender === 'user' ? 'user-bubble' : 'bot-bubble'}`;
  const p = document.createElement('p');
  p.textContent = text;
  bubble.appendChild(p);
  if (sender === 'bot' && confidence !== null) {
    const tag = document.createElement('span');
    tag.className = 'confidence-tag';
    tag.textContent = `match confidence: ${(confidence * 100).toFixed(0)}%`;
    bubble.appendChild(tag);
  }
  row.appendChild(bubble);
  chatArea.appendChild(row);
  scrollToBottom();
}

function sendMessage(text) {
  if (!text.trim()) return;
  addMessage(text, 'user');
  userInput.value = '';
  typingRow.hidden = false;
  scrollToBottom();

  setTimeout(() => {
    const result = getResponse(text);
    typingRow.hidden = true;
    addMessage(result.answer, 'bot', result.confidence);
  }, 400);
}

chatForm.addEventListener('submit', (e) => {
  e.preventDefault();
  sendMessage(userInput.value);
});

FAQS.slice(0, 4).forEach(f => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.textContent = f.q;
  chip.addEventListener('click', () => sendMessage(f.q));
  suggestionChips.appendChild(chip);
});
</script>
</body>
</html>
